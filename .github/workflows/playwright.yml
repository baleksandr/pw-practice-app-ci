name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps

      - name: Verify Playwright
        run: |
          ls node_modules/@playwright/test/ || echo "Playwright NOT installed"
          ls node_modules/.bin/playwright || echo "Playwright bin NOT found"

      - name: Install Playwright Browsers
        run: node node_modules/@playwright/test/cli.js install chromium --with-deps

      - name: Run Playwright tests
        run: node node_modules/@playwright/test/cli.js test usePageObjects.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30