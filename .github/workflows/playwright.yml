name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --force

      - name: Install Playwright separately
        run: npm install @playwright/test --force

      - name: Verify Playwright installed
        run: |
          ls -la node_modules/.bin/ | grep playwright || echo "playwright not in bin"
          cat node_modules/@playwright/test/package.json | head -5 || echo "package not found"
      
      - name: Install Playwright Browsers
        run: ./node_modules/.bin/playwright install chromium --with-deps

      - name: Run Playwright tests
        run: ./node_modules/.bin/playwright test usePageObjects.spec.ts --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30